name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Miya.slnx

      - name: Build
        run: dotnet build Miya.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Miya.slnx -c Release --no-build --no-restore

      - name: Determine package version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          projects=(
            src/Miya/Miya.csproj
            src/Miya.Json/Miya.Json.csproj
            src/Miya.Schema/Miya.Schema.csproj
            src/Miya.Generators/Miya.Generators.csproj
            src/Miya.Gen/Miya.Gen.csproj
          )

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              -c Release \
              --no-restore \
              --output artifacts \
              -p:Version="$PACKAGE_VERSION"
          done

      - name: Log in to NuGet with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: hckaye

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
