name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Mugi.slnx

      - name: Build
        run: dotnet build Mugi.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Mugi.slnx -c Release --no-build --no-restore
